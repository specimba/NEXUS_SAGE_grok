# PASS-Q1G (refs/PASS-Q1G-GITLAB-CI.md) — quota-smart crawl on GitLab CI Free, publish to GitHub Pages.
# Lives in the GitHub repo; GitLab project nexus-sage-ci points its CI config at this file's raw URL.
# No mirror: the job shallow-clones the public GitHub repo, runs, and pushes back (GitHub = source of truth).
# Secrets: only GH_PUSH_TOKEN (masked + protected GitLab variable, fine-grained, Contents RW on this repo only).
# Gmail (F) / X-session (E) are box-only: no creds here, SAGE_GMAIL_BOX_ONLY=1, committed snapshots only.
# Schedule is set in the GitLab UI: cron "11 6,11,16,21 * * *", timezone Europe/Istanbul, branch main.
# gh-pages: fast-forward only, never force. Cycle stays 003.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  TZ: Europe/Istanbul
  SAGE_GMAIL_BOX_ONLY: "1"
  PAGES_FETCH_DEPTH: "1"
  WATCHDOG_MISSED: $CI_PROJECT_DIR/watchdog-missed.txt   # --pre missed-slot marker; the last step fails the job on it
  GIT_STRATEGY: none          # the GitLab repo is only a README; we clone GitHub ourselves
  GH_REPO: specimba/NEXUS_SAGE_grok
  GIT_AUTHOR_NAME: sage-gitlab-ci
  GIT_AUTHOR_EMAIL: sage-gitlab-ci@users.noreply.github.com
  GIT_COMMITTER_NAME: sage-gitlab-ci
  GIT_COMMITTER_EMAIL: sage-gitlab-ci@users.noreply.github.com
  BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/bun
  SLOW_SECONDS: "240"
  # No Chrome in node:22.12-bookworm: static font gate instead of the headless one (box keeps the browser check),
  # overflow-390 only when non-data code changed since the last published main SHA (fails closed if it must run).
  SAGE_CI: "1"
  SAGE_FONT_CHECK: static
  SAGE_OVERFLOW_390: auto
  # ...and only on that code-changed path, pages-publish.sh fetches a pinned chrome-headless-shell (scripts/ci-chrome.sh:
  # 124 MB Chrome for Testing zip, sha256-pinned in the script, + 13 libs via apt from Debian's signed repos) into
  # $CI_PROJECT_DIR/.chrome-hs and points CHROME_BIN at it; the browser font-check then also runs on top of the static one.
  # Install seconds land in publish-proof.json (chrome_install_s). Q1G §2 amend: >60 s twice in a month ⇒ cached artifact.
  # Data-only runs install nothing. Deliberately NOT a GitLab cache (it would be pulled/pushed on all ~120 runs a month).
  # Install failure = CHECK FAIL, nothing published.
  SAGE_CHROME_INSTALL: "1"
  SAGE_CHROME_VERSION: "155.0.8059.79"
  SAGE_CHROME_SHA256: "4cea4c32b501aa43cc2b81eb45734af991a6a82feded48380d6dfaf96642a1c1"
  # PASS-D D6: atom-feed.ts writes its result line here; publish-proof.ts turns it into the crawl.log feed= suffix.
  ATOM_FEED_STATUS: $CI_PROJECT_DIR/atom-feed.status

crawl:
  # oven/bun images ship without git, so: pinned node bookworm (has git, curl, unzip) + bun 1.4.2 from the npm cache.
  # apt only on code-change runs (chrome-headless-shell libs, see SAGE_CHROME_INSTALL).
  image: node:22.12-bookworm
  timeout: 6m
  interruptible: false
  resource_group: sage-crawl
  cache:
    - key: bun-1.4.2-v1     # cache:key:files can't see bun.lock (cloned in-script); bump v1 when the lockfile churns
      paths: [.cache/bun]
    - key: next-$CI_PROJECT_ID
      paths: [.cache/next, .cache/npm]
  script:
    - t0=$(date +%s)
    - npm i -g --silent --cache "$CI_PROJECT_DIR/.cache/npm" bun@1.4.2 && bun --version
    - test -n "$GH_PUSH_TOKEN" || { echo "GH_PUSH_TOKEN missing (masked+protected CI variable)"; exit 1; }
    - git clone -q --depth 1 --branch main "https://github.com/$GH_REPO.git" repo
    - cd repo
    - git config credential.helper '!f() { echo username=x-access-token; echo "password=$GH_PUSH_TOKEN"; }; f'
    - cd desk
    # watchdog first (Q1G §2 slot rule): last checked_at < previous slot (06:11/11:11/16:11/21:11 TRT) − 10 min ⇒ exit 2 +
    # WATCHDOG_MISSED marker. Exit 2 is tolerated here so the crawl still runs and heals the desk; the last step goes red.
    # Any other non-zero exit (crash) stops the job. No last-checked.json = first run (exit 0).
    - bash scripts/ci-state.sh seed   # state lives on main (committed every run); gh-pages is only the fallback
    - rm -f "$WATCHDOG_MISSED"; bun scripts/watchdog.ts --pre || [ $? = 2 ]
    - mkdir -p .next && rm -rf .next/cache && mkdir -p "$CI_PROJECT_DIR/.cache/next" && ln -s "$CI_PROJECT_DIR/.cache/next" .next/cache
    - bun install --frozen-lockfile
    - export CRAWL_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"   # PASS-L: lead pick slot (06:11/11:11/16:11 retry, 21:11 no retry) keys off crawl START
    - bun run ingest
    - A2_FORCE_WINDOW=1 bun run a2:tick
    - bun run pack:export
    # PASS-D D1: morning Atom feed (data-only). After ingest wrote lead-history / wire / papers, before reader-hash (it hashes the feed).
    - 'bun scripts/atom-feed.ts || echo "atom-feed: crashed (soft)"'
    - export GITHUB_OUTPUT="$CI_PROJECT_DIR/hash.out"; true > "$GITHUB_OUTPUT"
    - bun scripts/reader-hash.ts
    - changed=$(grep -oE '^changed=.*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2); echo "changed=$changed"
    - |
      if [ "$changed" = "true" ]; then
        bun scripts/reader-hash.ts --commit published
        PAGES_WORKTREE="$CI_PROJECT_DIR/pages" bash scripts/pages-publish.sh
      else
        bun scripts/reader-hash.ts --commit skipped
        PAGES_WORKTREE="$CI_PROJECT_DIR/pages" bash scripts/pages-checked-push.sh
      fi
    - |
      crawl="$(grep -oE 'CRAWL_AT = "[^"]+"' src/data/x-crawl.ts | cut -d'"' -f2)"
      dur=$(( $(date +%s) - t0 )); slow=""; [ "$dur" -gt "$SLOW_SECONDS" ] && slow=" slow"
      mkdir -p ../logs
      proof="$(bun scripts/publish-proof.ts suffix --changed "$changed" --status "$ATOM_FEED_STATUS")"   # PASS-D D6: feed= ov390= fl=
      echo "$(date -u +%FT%TZ) gitlab pipeline $CI_PIPELINE_ID crawl $crawl changed=$changed $proof ${dur}s$slow" >> ../logs/crawl.log
      if [ "$changed" = "true" ]; then
        bash scripts/ci-state.sh stage true
        msg="chore(sage): crawl $crawl (gitlab) [skip ci]"
      else
        bash scripts/ci-state.sh stage false
        msg="chore(sage): crawl check, reader unchanged (gitlab) [skip ci]"
      fi
      git add -f -- ../logs/crawl.log
      git commit -q -m "$msg"
      ok=0
      for i in 1 2 3; do
        if git push -q origin HEAD:main; then ok=1; break; fi
        git fetch -q --deepen=50 origin main
        git rebase -q -X theirs origin/main
      done
      [ "$ok" = 1 ] || { echo "push to main failed after 3 tries" >&2; exit 1; }
    # budget guard: two `slow` runs in a row fail the job
    - |
      if [ "$(tail -2 ../logs/crawl.log | grep -c ' slow$')" = 2 ]; then echo "watchdog: 2 slow runs in a row (>${SLOW_SECONDS}s)" >&2; exit 1; fi
    # watchdog last: gh-pages crawl = main crawl, soft-fail ratio, hash gate (Pages deploy lags; retry)
    - |
      ok=0
      for i in 1 2 3 4 5 6; do bun scripts/watchdog.ts >/dev/null 2>&1 && { ok=1; break; }; sleep 20; done
      [ "$ok" = 1 ] || bun scripts/watchdog.ts
    - echo "PACK_ID=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("artifacts/sage/digest-last.json","utf8")).pack_id ?? "none")')"
    # missed slot: --pre exited 2. WARN only if this run's crawl healed checked_at for its own slot; red if still unhealed.
    - bun scripts/watchdog.ts --missed-slot
  # A failed run never reaches the commit step: still leave a crawl.log line in the job artifact (not pushed).
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ] && [ -d repo ]; then
        mkdir -p repo/logs
        echo "$(date -u +%FT%TZ) gitlab pipeline $CI_PIPELINE_ID job $CI_JOB_ID FAILED (status=$CI_JOB_STATUS, not pushed)" >> repo/logs/crawl.log
      fi
  artifacts:
    when: always
    name: sage-pack-$CI_PIPELINE_ID
    expire_in: 30 days
    # pack:export dual-homes sage-pack-*.tar.gz to <repo>/packs/ and <repo>/desk/packs/; reader-hash.json only exists after a
    # published run. Missing paths only warn in GitLab ("no matching files"), they don't fail the job.
    paths:
      - repo/packs/*.tar.gz
      - repo/desk/packs/*.tar.gz
      - repo/desk/artifacts/sage/packs/
      - repo/desk/artifacts/sage/digest-last.json
      - repo/desk/artifacts/sage/reader-hash.json
      - repo/desk/artifacts/sage/last-checked.json
      - repo/desk/artifacts/sage/publish-proof.json   # PASS-D D6 + Q1G §2: chrome_install_s, overflow_390, font_check, feed_* (kept on failed runs too)
      - repo/logs/crawl.log
