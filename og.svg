  </g>
  <text x="600" y="560" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#6b4a00">FALLOUT × MATRIX · AMBER PRIMARY · SIGNAL GREEN ONLY</text>
