  <path d="M48 72 V48 H72" fill="none" stroke="#ffb000" stroke-width="2"/>
  <path d="M1152 72 V48 H1128" fill="none" stroke="#ffb000" stroke-width="2"/>
  <path d="M48 558 V582 H72" fill="none" stroke="#ffb000" stroke-width="2"/>
  <path d="M1152 558 V582 H1128" fill="none" stroke="#ffb000" stroke-width="2"/>
  <!-- kicker -->
